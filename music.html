<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的歌单</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #fcf9f2; font-family: 'STXingkai', '华文新魏', sans-serif; color: #4a4a4a; padding: 40px; }
        
        /* 暴力锁死返回键 */
        .back-btn { position: fixed !important; top: 30px !important; left: 30px !important; z-index: 9999 !important; text-decoration: none !important; color: #d4a373; font-size: 1.2em; font-weight: bold; border: 2px solid #d4a373; padding: 8px 20px; border-radius: 20px; background: #fcf9f2; transition: 0.3s; }
        .back-btn:hover { background: #d4a373; color: #fff; }

        /* 黑胶唱片 */
        .vinyl-container { position: fixed; top: 20px; right: 40px; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, #333 30%, #111 70%, #000 100%); box-shadow: 0 10px 30px rgba(0,0,0,0.3); animation: spin 6s linear infinite; display: flex; justify-content: center; align-items: center; z-index: 100; }
        .vinyl-center { width: 50px; height: 50px; background: #d4a373; border-radius: 50%; border: 3px solid #fff; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 24px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .main-content { max-width: 700px; margin: 0 auto; padding-top: 50px; }
        h1 { text-align: center; color: #d4a373; font-size: 3em; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #999; margin-bottom: 50px; font-size: 1.2em; }

        .category { background: #fff; padding: 30px; border-radius: 20px; margin-bottom: 30px; box-shadow: 0 10px 25px rgba(212,163,115,0.1); border-left: 6px solid #d4a373; transition: 0.3s; }
        .category:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(212,163,115,0.2); }
        h2 { color: #b5835a; font-size: 1.8em; margin-bottom: 20px; border-bottom: 2px dashed #fdf2d5; padding-bottom: 10px; }
        
        ul { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        li { font-size: 1.1em; color: #555; display: flex; align-items: center; padding: 10px; border-radius: 10px; transition: 0.3s; cursor: pointer; }
        li:hover { background: #fdf2d5; color: #d4a373; padding-left: 15px; }
        li::before { content: '🎵'; margin-right: 10px; }
        
        /* 修复英文变形 */
        .category li, .category h2 { font-family: 'Segoe UI', 'Arial', 'STXingkai', '华文新魏', sans-serif; }
        @media (max-width: 600px) { ul { grid-template-columns: 1fr; } .vinyl-container { width: 100px; height: 100px; right: 20px; } }
    </style>
</head>
<body>
    <a href="index.html#hobbies" class="back-btn">← 返回主页</a >
    <div class="vinyl-container"><div class="vinyl-center">🎵</div></div>

    <div class="main-content">
        <h1>我的私人歌单</h1>
        <p class="subtitle">音乐是治愈一切的良药</p >
        <div class="category"><h2> 华语浪漫与流行</h2><ul><li>不说 - 周公</li><li>情人 - 蔡徐坤</li><li>这世界那么多人 - 莫文蔚</li><li>麦恩莉 - 方大同</li></ul></div>
        <div class="category"><h2> 独立与文艺感官</h2><ul><li>带我去找夜生活 - 告五人</li><li>推开世界的门 - 杨乃文</li><li>路过人间 - 郁可唯</li></ul></div>
        <div class="category"><h2> 古风与节奏布鲁斯</h2><ul><li>惊鸿一面 - 许嵩 / 黄龄</li><li>Back seat - JYJ</li></ul></div>
        <div class="category"><h2> 欧美流行</h2><ul><li>Call Me Maybe - Carly Rae Jepsen</li><li>Everywhere We Go - 陈冠希</li></ul></div>
    </div>
</body>
</html>
